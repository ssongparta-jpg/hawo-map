<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>로그인 - 화성오산 학교지도</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/login/login.css">
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>
    <div class="login-container">
        <main class="login-card">
            
            <header class="login-header">
                <img src="/source/hwaologo.png" alt="로고" class="login-logo" onerror="this.onerror=null; this.src='/source/share.png';">
                <h2>화성오산 학교지도</h2>
                <p>서비스 이용을 위해 로그인해주세요.</p>
            </header>

            <div class="login-tabs">
                <button class="tab-btn active" onclick="LoginApp.switchTab('user')">일반 로그인</button>
                <button id="admin-tab-btn" class="tab-btn" onclick="LoginApp.switchTab('admin')" style="display: none;">관리자 인증</button>
            </div>

            <div id="user-login-area" class="form-area active">
                <div class="input-group">
                    <input type="text" id="user-id" placeholder="아이디를 입력하세요" autocomplete="off" onkeydown="if(event.key==='Enter') document.getElementById('user-pw').focus();" onclick="LoginApp.handleIdClick()">
                </div>
                <div class="input-group">
                    <input type="password" id="user-pw" placeholder="비밀번호를 입력하세요" onkeydown="if(event.key==='Enter') LoginApp.userLogin();">
                </div>

                <div id="user-captcha-container" class="captcha-container" style="display: none;">
                    <div class="captcha-header">
                        <p class="captcha-title">🤖 봇 방지 캡챠</p>
                        <button type="button" class="captcha-refresh-btn" onclick="LoginApp.generateUserCaptcha()">↻ 그림 새로고침</button>
                    </div>
                    <div class="captcha-body">
                        <canvas id="user-captcha-canvas" width="200" height="60" class="captcha-canvas"></canvas>
                        <input type="text" id="user-captcha-input" class="captcha-input" placeholder="위 그림의 문자를 입력하세요" onkeydown="if(event.key === 'Enter') LoginApp.userLogin();">
                    </div>
                </div>

                <button class="btn-primary" onclick="LoginApp.userLogin()">로그인</button>
                
                <div class="form-footer">
                    <span onclick="LoginApp.showRegisterForm()">아직 계정이 없으신가요? <strong>회원가입</strong></span>
                </div>
                <button id="admin-reset-btn" onclick="LoginApp.requestAdminReset()">관리자 비밀번호 초기화 요청</button>
            </section>

            <section id="user-register-area" class="form-area" style="display: none;">
                <div class="info-box">회원정보를 입력해주세요.</div>
                
                <div class="input-group flex-group">
                    <input type="text" id="reg-id" class="flex-input" placeholder="아이디" onkeydown="if(event.key==='Enter') LoginApp.checkId();">
                    <button class="btn-check-id" onclick="LoginApp.checkId()">중복확인</button>
                </div>
                <div class="input-group">
                    <input type="password" id="reg-pw" placeholder="비밀번호 (4자 이상)" onkeydown="if(event.key==='Enter') document.getElementById('reg-pw-confirm').focus();">
                </div>
                <div class="input-group">
                    <input type="password" id="reg-pw-confirm" placeholder="비밀번호 확인" onkeydown="if(event.key==='Enter') LoginApp.userRegister();">
                </div>
                
                <button class="btn-primary" onclick="LoginApp.userRegister()">가입하기</button>
                <div class="form-footer">
                    <span onclick="LoginApp.switchTab('user')">&#8592; 로그인으로 돌아가기</span>
                </div>
            </section>

            <section id="admin-step1-area" class="form-area" style="display: none;">
                <div class="info-box">부여받은 관리자 ID를 입력해주세요.</div>
                <div class="input-group">
                    <input type="text" id="admin-id" placeholder="관리자 ID (예: admin)" onkeydown="if(event.key==='Enter') LoginApp.requestAdminEmail();">
                </div>
                <button class="btn-primary admin-btn" onclick="LoginApp.requestAdminEmail()">인증 메일 발송</button>
            </section>

            <section id="admin-step2-area" class="form-area" style="display: none;">
                <div class="info-box success" id="admin-msg">메일로 인증 코드가 발송되었습니다.</div>
                <div class="input-group">
                    <input type="text" id="admin-otp" class="otp-input" placeholder="인증코드 6자리" onkeydown="if(event.key==='Enter') LoginApp.verifyAdminCode();">
                </div>
                
                <div class="recaptcha-wrapper">
                    <div class="g-recaptcha" data-sitekey="6Lf2q-csAAAAAAYzpCTLVDJY2Ez64JN7gYbwq1lX"></div>
                </div>

                <button class="btn-primary admin-btn" onclick="LoginApp.verifyAdminCode()">인증 확인 및 로그인</button>
            </section>

            <footer class="back-link">
                <a href="/">&#8592; 지도로 돌아가기</a>
            </footer>

        </main>
    </div>

    <script src="/login/login.js"></script>
</body>
</html>
