<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>경기도화성오산교육지원청 학교 지도</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/header.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/ui.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/marker.css" />
  <link rel="stylesheet" href="css/popup.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>
  <div class="container"> 
    
    <div class="pc-top-bar"></div>

    <header class="header-center-group">
      <div class="header-shape">
        <button class="help-button" id="helpBtn" title="도움말">?</button>
        <a href="https://www.goehs.kr" target="_blank" class="logo-area">
            <img src="hwaologo.svg" alt="GOEHS" class="logo-img" onerror="this.style.display='none';this.parentNode.innerText='GOEHS';"/>
        </a>
        <span class="header_text" id="header-title">로딩 중...</span>
      </div>
    </header>
    
    <div class="search-container">
        <div class="search-wrapper">
            <input type="text" id="schoolSearch" class="search-input-box" placeholder="학교명 검색 (예: 삼괴고)" autocomplete="off" />
            <div id="searchResults" class="search-results-list"></div>
        </div>
        <button onclick="FilterManager.open()" class="advanced-search-btn">상세 검색</button>
    </div>

    <div id="auth-area">
      <div id="login-form">
        <input type="text" id="user-id" placeholder="ID" autocomplete="off">
        <input type="password" id="user-pw" placeholder="PW">
        <button onclick="AuthManager.login()" class="btn-login">로그인</button>
        <button onclick="AuthManager.register()" class="btn-join">가입</button>
      </div>
      
      <div id="user-info" style="display:none;">
        <span id="welcome-msg" style="font-weight:bold; margin-right:5px; font-size: 13px;"></span>
        <button id="change-pw-btn" onclick="AuthManager.changePw()" style="display:none;">PW변경</button>
        
        <button id="admin-panel-btn" onclick="AdminManager.open()" class="btn-admin" style="display: none;">관리자</button>
        
        <button onclick="AuthManager.logout()" class="btn-logout">로그아웃</button>
      </div>
    </div>

    <div id="legend" class="legend-floating-box"></div>

    <div class="boundary-toggle-container">
        <div class="control-row">
            <span class="switch-label">행정구역 켜기/끄기</span>
            <label class="toggle-switch">
                <input type="checkbox" id="toggle-boundary" checked>
                <span class="slider"></span>
            </label>
        </div>
        <div class="control-row" style="margin-left: 15px;">
            <span class="switch-label">즐겨찾기</span>
            <label class="toggle-switch">
                <input type="checkbox" id="toggle-favorite-only">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <div id="map"></div>
    
    <button id="btn-measure" onclick="DistanceManager.toggle()">📏 거리재기</button>

    <div id="search-dashboard" class="dashboard-backdrop" style="display:none;">
        <div class="dashboard-window">
            <div class="dash-header">
                <div class="search-bar-wrap">
                    <input type="text" id="adv-name-input" placeholder="학교명 입력">
                    <button class="dash-main-search-btn" onclick="FilterManager.execute()">검색</button>
                </div>
                <button class="dash-close-btn" onclick="FilterManager.close()">✕</button>
            </div>
            <div class="dash-body">
                <div class="filter-group">
                    <h3>학교급 분류</h3>
                    <div class="tag-container">
                        <button type="button" class="filter-tag" data-type="유치원">유치원</button>
                        <button type="button" class="filter-tag" data-type="초등학교">초등학교</button>
                        <button type="button" class="filter-tag" data-type="중학교">중학교</button>
                        <button type="button" class="filter-tag" data-type="고등학교">고등학교</button>
                        <button type="button" class="filter-tag" data-type="특수학교">특수학교</button>
                    </div>
                </div>
                <div class="filter-group">
                    <h3>설립 구분</h3>
                    <div class="tag-container">
                        <button type="button" class="est-tag" data-est="공립">공립</button>
                        <button type="button" class="est-tag" data-est="사립">사립</button>
                    </div>
                </div>
                <div class="filter-group">
                  <h3>행정구역</h3>
                  <div class="tag-container" id="district-tag-container">
                    <button type="button" class="dist-tag" data-dist="동탄구">동탄구</button>
                    <button type="button" class="dist-tag" data-dist="병점구">병점구</button>
                    <button type="button" class="dist-tag" data-dist="효행구">효행구</button>
                    <button type="button" class="dist-tag" data-dist="만세구">만세구</button>
                    <button type="button" class="dist-tag" data-dist="오산시">오산시</button>
                  </div>
                </div>
                <section class="filter-group">
                    <h3>상세 조건</h3>
                    <div class="range-grid">
                        <div class="range-item"><label>학생 수</label><div class="range-controls"><div class="range-box min"><span>▲</span><input type="number" id="min-s"></div><div class="range-box max"><span>▼</span><input type="number" id="max-s"></div></div></div>
                        <div class="range-item"><label>학급 수</label><div class="range-controls"><div class="range-box min"><span>▲</span><input type="number" id="min-c"></div><div class="range-box max"><span>▼</span><input type="number" id="max-c"></div></div></div>
                        <div class="range-item"><label>교사 수</label><div class="range-controls"><div class="range-box min"><span>▲</span><input type="number" id="min-t"></div><div class="range-box max"><span>▼</span><input type="number" id="max-t"></div></div></div>
                        <div class="range-item"><label>학급당 학생 수</label><div class="range-controls"><div class="range-box min"><span>▲</span><input type="number" id="min-sc"></div><div class="range-box max"><span>▼</span><input type="number" id="max-sc"></div></div></div>
                        <div class="range-item"><label>교사 1인당 학생 수</label><div class="range-controls"><div class="range-box min"><span>▲</span><input type="number" id="min-st"></div><div class="range-box max"><span>▼</span><input type="number" id="max-st"></div></div></div>
                    </div>
                </section>
            </div>
            <div class="dash-footer">
                <button class="reset-btn" onclick="FilterManager.reset()">🔄 초기화</button>
            </div>
        </div>
    </div>
    
    <div id="search-results-page" class="dashboard-backdrop" style="display:none;">
        <div class="dashboard-window results-window" style="height: 80vh;">
            <div class="dash-header">
                <div class="results-header-title">
                    검색 결과 <span id="results-count-badge" class="results-count-badge">0</span>
                </div>
                <button class="dash-close-btn" onclick="ResultPageManager.close()">✕</button>
            </div>
            <div id="results-list-container"></div>
        </div>
    </div>

    <div id="admin-modal" class="dashboard-backdrop" style="display:none;">
        <div class="dashboard-window">
            <div class="dash-header" style="background: #e74c3c;">
                <h3>관리자 패널</h3>
                <button class="dash-close-btn" onclick="AdminManager.close()" style="margin-left: auto;">✕</button>
            </div>
            <div style="padding: 10px; display:flex; gap:10px; background:#f0f0f0;">
                <button onclick="AdminManager.manageUsers()">회원 관리</button>
                <button onclick="AdminManager.viewAllMemos()">전체 메모</button>
                <button onclick="AdminManager.loadResetRequests()">PW 초기화</button>
            </div>
            <div id="admin-content" class="dash-body"></div>
        </div>
    </div>

    <div id="admin-login-modal" class="dashboard-backdrop" style="display:none; z-index: 100001;">
        <div class="dashboard-window" style="max-width: 350px; height: auto;">
            <div class="dash-header" style="background: #333; color: white;">
                <h3>관리자 계정 인증</h3>
                <button class="dash-close-btn" onclick="AdminManager.closeLoginModal()" style="margin-left: auto; color:white;">✕</button>
            </div>
            <div class="dash-body" style="padding: 20px; text-align: center;">
                <div id="admin-step-1">
                    <p style="margin-bottom: 15px; color: #666;">인증 메일을 발송할 관리자를 선택하세요.</p>
                    <div class="admin-select-btn-group">
                        <button onclick="AdminManager.selectAdmin('spring')" class="admin-select-btn">🌸 관리자 1 (Spring)</button>
                        <button onclick="AdminManager.selectAdmin('summer')" class="admin-select-btn">🌻 관리자 2 (Summer)</button>
                        <button onclick="AdminManager.selectAdmin('autumn')" class="admin-select-btn">🍁 관리자 3 (Autumn)</button>
                    </div>
                </div>
                
                <div id="admin-step-2" style="display:none;">
                    <p id="admin-step-2-msg" style="margin-bottom: 10px; font-weight: bold; color: #2ecc71;"></p>
                    <input type="text" id="admin-otp-input" placeholder="인증코드 6자리" style="width: 100%; padding: 10px; font-size: 16px; text-align: center; margin-bottom: 10px;">
                    <button onclick="AdminManager.submitCode()" class="admin-submit-btn">인증 확인</button>
                </div>
            </div>
        </div>
    </div>

    <div id="helpModal" class="help-modal-overlay" style="display:none;">
        <div class="help-modal-content">
            <span class="help-close-btn" onclick="document.getElementById('helpModal').style.display='none'">&times;</span>
            <div id="helpContentInject"></div>
        </div>
    </div>
  </div>

    <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
    <script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>

    <script src="js/config.js" defer></script>
    <script src="js/utils.js" defer></script>
    <script src="js/auth.js" defer></script>
    <script src="js/search.js" defer></script>
    <script src="js/map.js" defer></script>
    <script src="js/main.js" defer></script>
</body>
</html>
