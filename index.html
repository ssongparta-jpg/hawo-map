<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>경기도화성오산교육지원청 학교 지도</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/header.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/ui.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/marker.css" />
  <link rel="stylesheet" href="css/popup.css" />
  <link rel="stylesheet" href="css/dashboard.css" />

  <meta name="description" content="경기도 화성시, 오산시의 초·중·고등학교 및 다(多)가치, 오산나래 공유학교 위치와 상세 정보를 한눈에 확인하세요.">
  <meta name="keywords" content="화성오산교육지원청, 화성 학교지도, 오산 학교지도, 공유학교 지도, 화성 다가치, 오산나래, 코코, 까까, 공유학교, 경기도, 화성시, 오산시, 공유학교, 메모">

  <meta property="og:type" content="website">
  <meta property="og:title" content="화성오산 학교 & 공유학교 지도">
  <meta property="og:description" content="경기도 화성시, 오산시의 학교 및 공유학교 위치를 한눈에 확인하세요. 회원가입 후 메모도 가능합니다!">
  <meta property="og:image" content="https://goehsmap.o-r.kr/source/hwaologo.png"> <meta property="og:url" content="https://goehsmap.o-r.kr/">
</head>
<body>
  <div class="container"> 
    
    <div class="pc-top-bar"></div>

    <header class="header-center-group">
      <div class="header-shape" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
        
        <div class="logo-group" style="width: 40px; display: flex; justify-content: flex-start;">
          <button class="help-button" id="helpBtn">?</button>
        </div>

        <div class="title-wrapper" style="display: flex; align-items: center; justify-content: center; gap: 10px;">
          <a href="https://www.goehs.kr/" target="_blank" class="logo-area" style="display: flex; align-items: center;">
            <img src="source/hwaologo.svg" alt="GOEHS" class="logo-img" style="height: 32px; width: auto;" />
          </a>
          <span class="header_text" id="header-title" style="margin: 0;">경기도화성오산교육지원청 학교 지도</span>
          <a href="/share" class="title-switch-btn" title="공유학교 지도로 전환" style="overflow: hidden; background: white; padding: 0; width: 28px; height: 28px; display: inline-block; flex-shrink: 0; margin-left: 2px;">
            <img src="source/share.png" alt="공유학교" style="width: 100%; height: 100%; object-fit: cover;" />
          </a>
        </div>

        <div class="header-right-empty" style="width: 40px;"></div>
        
      </div>
    </header>
    
    <div class="search-container">
        <div class="search-wrapper">
            <input type="text" id="schoolSearch" class="search-input-box" placeholder="학교명 검색 (예: 갈담초)" autocomplete="off" />
            <div id="searchResults" class="search-results-list"></div>
        </div>
        <button onclick="FilterManager.open()" class="advanced-search-btn">상세 검색</button>
    </div>

    <div id="auth-area">
      <div id="login-form">
        <input type="text" id="user-id" placeholder="ID" autocomplete="off">
        <input type="password" id="user-pw" placeholder="PW">
        <button onclick="AuthManager.login()" class="btn-login">로그인</button>
        <button onclick="AuthManager.register()" class="btn-join">가입</button>
      </div>
      
      <div id="user-info" style="display:none;">
        <span id="welcome-msg" style="font-weight:bold; margin-right:5px; font-size: 13px;"></span>
        <button id="change-pw-btn" onclick="AuthManager.changePw()" style="display:none;">PW변경</button>
        
        <button id="admin-panel-btn" onclick="AdminManager.open()" class="btn-admin" style="display: none;">관리자</button>
        
        <button onclick="AuthManager.logout()" class="btn-logout">로그아웃</button>
      </div>
    </div>

    <div id="legend" class="legend-floating-box"></div>

    <div class="boundary-toggle-container">
        <div class="control-row">
            <span class="switch-label">행정구역 켜기/끄기</span>
            <label class="toggle-switch">
                <input type="checkbox" id="toggle-boundary" checked>
                <span class="slider"></span>
            </label>
        </div>
        <div class="control-row" style="margin-left: 15px;">
            <span class="switch-label">즐겨찾기</span>
            <label class="toggle-switch">
                <input type="checkbox" id="toggle-favorite-only">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <div id="map"></div>
    
    <button id="btn-measure" onclick="DistanceManager.toggle()">📏 거리재기</button>

    <div id="search-dashboard" class="dashboard-backdrop" style="display:none;">
        <div class="dashboard-window">
            <div class="dash-header">
                <div class="search-bar-wrap">
                    <input type="text" id="adv-name-input" placeholder="학교명 입력">
                    <button class="dash-main-search-btn" onclick="FilterManager.execute()">검색</button>
                </div>
                <button class="dash-close-btn" onclick="FilterManager.close()">✕</button>
            </div>
            <div class="dash-body">
                <div class="filter-group">
                    <h3>학교급 분류</h3>
                    <div class="tag-container">
                        <button type="button" class="filter-tag" data-type="유치원">유치원</button>
                        <button type="button" class="filter-tag" data-type="초등학교">초등학교</button>
                        <button type="button" class="filter-tag" data-type="중학교">중학교</button>
                        <button type="button" class="filter-tag" data-type="고등학교">고등학교</button>
                        <button type="button" class="filter-tag" data-type="특수학교">특수학교</button>
                    </div>
                </div>
                <div class="filter-group">
                    <h3>설립 구분</h3>
                    <div class="tag-container">
                        <button type="button" class="est-tag" data-est="공립">공립</button>
                        <button type="button" class="est-tag" data-est="사립">사립</button>
                    </div>
                </div>
                <div class="filter-group">
                  <h3>행정구역</h3>
                  <div class="tag-container" id="district-tag-container">
                    <button type="button" class="dist-tag" data-dist="동탄구">동탄구</button>
                    <button type="button" class="dist-tag" data-dist="병점구">병점구</button>
                    <button type="button" class="dist-tag" data-dist="효행구">효행구</button>
                    <button type="button" class="dist-tag" data-dist="만세구">만세구</button>
                    <button type="button" class="dist-tag" data-dist="오산시">오산시</button>
                  </div>
                </div>
                <section class="filter-group">
                    <h3>상세 조건</h3>
                    <div class="range-grid">
                        <div class="range-item"><label>학생 수</label><div class="range-controls"><div class="range-box min"><span>▲</span><input type="number" id="min-s"></div><div class="range-box max"><span>▼</span><input type="number" id="max-s"></div></div></div>
                        <div class="range-item"><label>학급 수</label><div class="range-controls"><div class="range-box min"><span>▲</span><input type="number" id="min-c"></div><div class="range-box max"><span>▼</span><input type="number" id="max-c"></div></div></div>
                        <div class="range-item"><label>교사 수</label><div class="range-controls"><div class="range-box min"><span>▲</span><input type="number" id="min-t"></div><div class="range-box max"><span>▼</span><input type="number" id="max-t"></div></div></div>
                        <div class="range-item"><label>학급당 학생 수</label><div class="range-controls"><div class="range-box min"><span>▲</span><input type="number" id="min-sc"></div><div class="range-box max"><span>▼</span><input type="number" id="max-sc"></div></div></div>
                        <div class="range-item"><label>교사 1인당 학생 수</label><div class="range-controls"><div class="range-box min"><span>▲</span><input type="number" id="min-st"></div><div class="range-box max"><span>▼</span><input type="number" id="max-st"></div></div></div>
                    </div>
                </section>
            </div>
            <div class="dash-footer">
                <button class="reset-btn" onclick="FilterManager.reset()">🔄 초기화</button>
            </div>
        </div>
    </div>
    
    <div id="search-results-page" class="dashboard-backdrop" style="display:none;">
        <div class="dashboard-window results-window" style="height: 80vh;">
            <div class="dash-header">
                <div class="results-header-title">
                    검색 결과 <span id="results-count-badge" class="results-count-badge">0</span>
                </div>
                <button class="dash-close-btn" onclick="ResultPageManager.close()">✕</button>
            </div>
            <div id="results-list-container"></div>
        </div>
    </div>

    <div id="admin-modal" class="dashboard-backdrop" style="display:none;">
        <div class="dashboard-window">
            <div class="dash-header" style="background: #e74c3c;">
                <h3>관리자 패널</h3>
                <button class="dash-close-btn" onclick="AdminManager.close()" style="margin-left: auto;">✕</button>
            </div>
            <div style="padding: 10px; display:flex; gap:10px; background:#f0f0f0;">
                <button onclick="AdminManager.manageUsers()">회원 관리</button>
                <button onclick="AdminManager.viewAllMemos()">전체 메모</button>
                <button onclick="AdminManager.loadResetRequests()">PW 초기화</button>
            </div>
            <div id="admin-content" class="dash-body"></div>
        </div>
    </div>

    <div id="admin-login-modal" class="dashboard-backdrop" style="display:none; z-index: 100001;">
        <div class="dashboard-window" style="width: 450px; max-width: 90%; height: auto; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
            <div class="dash-header" style="background: #2c3e50; color: white; padding: 15px 20px;">
                <h3 style="margin:0; font-size: 18px;">🛡️ 관리자 인증 시스템</h3>
                <button type="button" class="dash-close-btn" onclick="AdminManager.closeLoginModal()" style="margin-left: auto; color:white; font-size:20px; border:none; background:none; cursor:pointer;">✕</button>
            </div>
            <div class="dash-body" style="padding: 30px; text-align: center; background: #f8f9fa;">
                
                <div id="admin-step-1">
                    <p style="margin-bottom: 20px; color: #555; font-weight: 500; font-size: 15px;">부여받은 관리자 ID를 입력해주세요.</p>
                    <input type="text" id="admin-id-input" placeholder="관리자 ID" style="width: 100%; padding: 14px; font-size: 16px; border: 1px solid #ccd1d9; border-radius: 6px; margin-bottom: 15px; box-sizing: border-box; text-align: center;" onkeydown="if(event.key === 'Enter'){ event.preventDefault(); AdminManager.requestEmail(); }">
                    <button type="button" onclick="event.preventDefault(); event.stopPropagation(); AdminManager.requestEmail();" style="width: 100%; background: #3498db; color: white; border: none; padding: 14px; font-size: 16px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s;">인증 메일 발송</button>
                </div>
                
                <div id="admin-step-2" style="display:none;">
                    <p id="admin-step-2-msg" style="margin-bottom: 20px; font-weight: bold; color: #27ae60; font-size: 14px;"></p>
                    
                    <input type="text" id="admin-otp-input" placeholder="인증코드 6자리" style="width: 100%; padding: 14px; font-size: 18px; text-align: center; border: 1px solid #ccd1d9; border-radius: 6px; margin-bottom: 15px; box-sizing: border-box; letter-spacing: 2px; font-weight: bold;" onkeydown="if(event.key === 'Enter'){ event.preventDefault(); document.getElementById('admin-captcha-input').focus(); }">
                    
                    <div style="background: #fff; border: 1px solid #e0e0e0; border-radius: 6px; padding: 15px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
                        <p style="margin: 0 0 10px 0; font-size: 13px; color: #e74c3c; font-weight: bold;">🤖 자동화 공격 방지 캡챠</p>
                        <div style="display: flex; align-items: center; justify-content: center; gap: 10px;">
                            <span id="captcha-question" style="font-size: 20px; font-weight: 900; color: #333; background: #fdf2f0; padding: 6px 15px; border-radius: 4px; letter-spacing: 1px;">? + ? =</span>
                            <input type="number" id="admin-captcha-input" placeholder="정답" style="width: 90px; padding: 12px; font-size: 16px; text-align: center; border: 1px solid #ccc; border-radius: 6px;" onkeydown="if(event.key === 'Enter'){ event.preventDefault(); AdminManager.submitCode(); }">
                        </div>
                    </div>

                    <button type="button" onclick="event.preventDefault(); event.stopPropagation(); AdminManager.submitCode();" style="width: 100%; background: #2ecc71; color: white; border: none; padding: 14px; font-size: 16px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s;">인증 확인 및 로그인</button>
                </div>
            </div>
        </div>
    </div>

    <div id="helpModal" class="help-modal-overlay" style="display:none;">
        <div class="help-modal-content">
            <span class="help-close-btn" onclick="document.getElementById('helpModal').style.display='none'">&times;</span>
            <div id="helpContentInject"></div>
        </div>
    </div>
  </div>


    <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
    <script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="js/config.js" defer></script>
    <script src="js/utils.js" defer></script>
    <script src="js/auth.js" defer></script>
    <script src="js/search.js" defer></script>
    <script src="js/map.js" defer></script>
    <script src="js/main.js" defer></script>
    <script src="js/notice.js" defer></script>

    <style>
      .shared-popup-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.6); z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        opacity: 0; visibility: hidden; transition: opacity 0.3s ease;
      }
      .shared-popup-overlay.active {
        opacity: 1; visibility: visible;
      }
      .shared-popup-box {
        background: #ffffff; width: 90%; max-width: 360px;
        border-radius: 24px; overflow: hidden;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        transform: translateY(20px); transition: transform 0.3s ease;
        font-family: 'Noto Sans KR', sans-serif;
      }
      .shared-popup-overlay.active .shared-popup-box {
        transform: translateY(0);
      }
      .shared-popup-header {
        background: #2563eb; padding: 22px 20px; text-align: center; color: #ffffff;
      }
      .shared-popup-header h2 {
        margin: 0; font-size: 18px; font-weight: 900; line-height: 1.4; letter-spacing: -0.5px;
      }
      .shared-popup-body {
        padding: 24px; text-align: center;
      }
      .shared-popup-image-wrap {
        border-radius: 12px; overflow: hidden; border: 2px solid #f3f4f6; margin-bottom: 20px;
      }
      .shared-popup-image-wrap img {
        width: 100%; display: block;
      }
      .shared-popup-text {
        font-size: 14px; color: #4b5563; line-height: 1.6; word-break: keep-all; margin: 0; font-weight: 500;
      }
      .shared-popup-text strong { color: #2563eb; font-weight: 900; }
      .shared-popup-footer {
        padding: 0 24px 24px; display: flex; flex-direction: column; gap: 14px;
      }
      .shared-popup-close-btn {
        width: 100%; padding: 14px; background: #1f2937; color: #ffffff;
        border: none; border-radius: 14px; font-size: 16px; font-weight: bold;
        cursor: pointer; transition: background 0.2s, transform 0.1s;
      }
      .shared-popup-close-btn:active { transform: scale(0.96); }
      .shared-popup-close-btn:hover { background: #000000; }
      .shared-popup-options {
        display: flex; justify-content: center; gap: 20px; font-size: 12px; font-weight: bold; color: #6b7280;
      }
      .shared-popup-options label {
        display: flex; align-items: center; gap: 6px; cursor: pointer;
      }
      .shared-popup-options input[type="checkbox"] {
        width: 16px; height: 16px; cursor: pointer; accent-color: #2563eb; margin: 0;
      }
    </style>

    <div id="shared-school-popup" class="shared-popup-overlay">
      <div class="shared-popup-box">
        
        <div class="shared-popup-header">
          <h2>새로 추가된<br>공유학교 지도를 만나보세요!</h2>
        </div>
    
        <div class="shared-popup-body">
          <div class="shared-popup-image-wrap">
            <img src="source/click.png" alt="공유학교 지도 버튼 안내">
          </div>
          <p class="shared-popup-text">
            위 사진의 버튼을 누르시면<br><strong>공유학교 지도</strong>로 전환됩니다.<br><br>
            공유학교 지도에서 같은 위치의 버튼을 누르면<br>다시 원래 지도 홈페이지로 돌아옵니다.
          </p>
        </div>
    
        <div class="shared-popup-footer">
          <button id="btn-close-popup" class="shared-popup-close-btn">닫기</button>
          <div class="shared-popup-options">
            <label>
              <input type="checkbox" id="chk-hide-7days"> <span>7일간 보지 않기</span>
            </label>
            <label>
              <input type="checkbox" id="chk-hide-forever"> <span>계속 보지 않기</span>
            </label>
          </div>
        </div>
        
      </div>
    </div>
</div>
</body>

</html>
