<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>비밀번호 변경 - 화성오산 학교지도</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/login/login.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="login-container">
        <main class="login-card">
            
            <header class="login-header">
                <h2>비밀번호 변경</h2>
                <p class="mt-10">안전을 위해 새로운 비밀번호를 설정해주세요.</p>
            </header>

            <section class="form-area active mt-20">
                <div class="input-group">
                    <input type="password" id="new-pw" placeholder="새 비밀번호 (4자 이상)">
                </div>
                <div class="input-group">
                    <input type="password" id="new-pw-confirm" placeholder="새 비밀번호 한 번 더 입력">
                </div>
                
                <button class="btn-primary mt-15" id="btn-change-pw">비밀번호 변경 완료</button>
            </section>

            <footer class="back-link">
                <a href="/">&#8592; 지도로 돌아가기</a>
            </footer>

        </main>
    </div>

    <script src="/login/pw_change.js"></script>
</body>
</html>
