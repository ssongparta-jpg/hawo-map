<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>화성오산 공유학교 지도</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/header.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/ui.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/marker.css" />
  <link rel="stylesheet" href="css/popup.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/share.css" />

  <meta name="description" content="경기도 화성시, 오산시의 초·중·고등학교 및 다(多)가치, 오산나래 공유학교 위치와 상세 정보를 한눈에 확인하세요.">
  <meta name="keywords" content="화성오산교육지원청, 화성 학교지도, 오산 학교지도, 공유학교 지도, 화성 다가치, 오산나래, 코코, 까까, 공유학교, 경기도, 화성시, 오산시, 공유학교, 메모">

  <meta property="og:type" content="website">
  <meta property="og:title" content="화성오산 학교 & 공유학교 지도">
  <meta property="og:description" content="경기도 화성시, 오산시의 학교 및 공유학교 위치를 한눈에 확인하세요. 회원가입 후 메모도 가능합니다!">
  <meta property="og:image" content="https://goehsmap.o-r.kr/source/share.png"> <meta property="og:url" content="https://goehsmap.o-r.kr/share">

</head>
<body>
  <div class="container"> 
    
    <div class="pc-top-bar"></div>

    <header class="header-center-group">
      <div class="header-shape" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
        
        <div class="logo-group" style="width: 40px; display: flex; justify-content: flex-start;">
          <button class="help-button" id="helpBtn">?</button>
        </div>

        <div class="title-wrapper" style="display: flex; align-items: center; justify-content: center; gap: 10px;">
          <a href="https://gong-u.goe.go.kr/base/main/view" target="_blank" class="logo-area" style="display: flex; align-items: center;">
            <img src="source/share.png" alt="Share" class="logo-img" style="height: 32px; width: auto; border-radius: 4px; background: white;" />
          </a>
          <span class="header_text" id="header-title" style="margin: 0;">화성오산 공유학교 지도</span>
          <a href="/" class="title-switch-btn" title="학교 지도로 전환" style="overflow: hidden; background: white; padding: 0; display:flex; align-items:center; justify-content:center; width: 28px; height: 28px; flex-shrink: 0; margin-left: 2px;">
            <img src="source/hwaologo.svg" alt="학교지도" style="width: 80%; height: 80%; object-fit: contain; margin-left: 2px;" />
          </a>
        </div>

        <div class="header-right-empty" style="width: 40px;"></div>
        
      </div>
    </header>
    
    <div class="search-container">
        <div class="search-wrapper">
            <input type="text" id="schoolSearch" class="search-input-box" placeholder="공유학교명 검색" autocomplete="off" />
            <div id="searchResults" class="search-results-list"></div>
        </div>
    </div>

    <div id="auth-area">
      <div id="login-form">
        <input type="text" id="user-id" placeholder="ID" autocomplete="off">
        <input type="password" id="user-pw" placeholder="PW">
        <button onclick="AuthManager.login()" class="btn-login">로그인</button>
        <button onclick="AuthManager.register()" class="btn-join">가입</button>
      </div>
      
      <div id="user-info" style="display:none;">
        <span id="welcome-msg" style="font-weight:bold; margin-right:5px; font-size: 13px;"></span>
        <button id="change-pw-btn" onclick="AuthManager.changePw()" style="display:none;">PW변경</button>
        <button id="admin-panel-btn" onclick="AdminManager.open()" class="btn-admin" style="display: none;">관리자</button>
        <button onclick="AuthManager.logout()" class="btn-logout">로그아웃</button>
      </div>
    </div>

    <div class="boundary-toggle-container">
        <div class="control-row">
            <span class="switch-label">행정구역 켜기/끄기</span>
            <label class="toggle-switch">
                <input type="checkbox" id="toggle-boundary" checked>
                <span class="slider"></span>
            </label>
        </div>
        <div class="control-row" style="margin-left: 15px;">
            <span class="switch-label">즐겨찾기</span>
            <label class="toggle-switch">
                <input type="checkbox" id="toggle-favorite-only">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <div id="map"></div>

    <button id="btn-measure" onclick="DistanceManager.toggle()">📏 거리재기</button>

    <div id="admin-modal" class="dashboard-backdrop" style="display:none;">
        <div class="dashboard-window">
            <div class="dash-header" style="background: #e74c3c;">
                <h3>관리자 패널</h3>
                <button class="dash-close-btn" onclick="AdminManager.close()" style="margin-left: auto;">✕</button>
            </div>
            <div style="padding: 10px; display:flex; gap:10px; background:#f0f0f0;">
                <button onclick="AdminManager.manageUsers()">회원 관리</button>
                <button onclick="AdminManager.viewAllMemos()">전체 메모</button>
                <button onclick="AdminManager.loadResetRequests()">PW 초기화</button>
            </div>
            <div id="admin-content" class="dash-body"></div>
        </div>
    </div>

    <div id="admin-login-modal" class="dashboard-backdrop" style="display:none; z-index: 1050;">
        <div class="dashboard-window" style="width: 450px; max-width: 90%; height: auto; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
            <div class="dash-header" style="background: #2c3e50; color: white; padding: 15px 20px;">
                <h3 style="margin:0; font-size: 18px;">🛡️ 관리자 인증 시스템</h3>
                <button type="button" class="dash-close-btn" onclick="AdminManager.closeLoginModal()" style="margin-left: auto; color:white; font-size:20px; border:none; background:none; cursor:pointer;">✕</button>
            </div>
            <div class="dash-body" style="padding: 30px; text-align: center; background: #f8f9fa;">
                
                <div id="admin-step-1">
                    <p style="margin-bottom: 20px; color: #555; font-weight: 500; font-size: 15px;">부여받은 관리자 ID를 입력해주세요.</p>
                    <input type="text" id="admin-id-input" placeholder="관리자 ID" style="width: 100%; padding: 14px; font-size: 16px; border: 1px solid #ccd1d9; border-radius: 6px; margin-bottom: 15px; box-sizing: border-box; text-align: center;" onkeydown="if(event.key === 'Enter'){ event.preventDefault(); AdminManager.requestEmail(); }">
                    <button type="button" onclick="event.preventDefault(); event.stopPropagation(); AdminManager.requestEmail();" style="width: 100%; background: #3498db; color: white; border: none; padding: 14px; font-size: 16px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s;">인증 메일 발송</button>
                </div>
                
                <div id="admin-step-2" style="display:none;">
                    <p id="admin-step-2-msg" style="margin-bottom: 20px; font-weight: bold; color: #27ae60; font-size: 14px;"></p>
                    
                    <input type="text" id="admin-otp-input" placeholder="인증코드 6자리" style="width: 100%; padding: 14px; font-size: 18px; text-align: center; border: 1px solid #ccd1d9; border-radius: 6px; margin-bottom: 15px; box-sizing: border-box; letter-spacing: 2px; font-weight: bold;" onkeydown="if(event.key === 'Enter'){ event.preventDefault(); document.getElementById('admin-captcha-input').focus(); }">
                    
                    <div style="background: #fff; border: 1px solid #e0e0e0; border-radius: 6px; padding: 15px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                            <p style="margin: 0; font-size: 13px; color: #e74c3c; font-weight: bold;">🤖 사람 확인 캡챠</p>
                            <button type="button" onclick="AdminManager.generateCaptcha()" style="background: none; border: none; color: #3498db; font-size: 12px; cursor: pointer; padding: 0; font-weight: bold;">↻ 이미지 새로고침</button>
                        </div>
                        <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
                            <canvas id="captcha-canvas" width="200" height="60" style="border: 1px solid #ddd; border-radius: 4px; background: #fdf2f0; letter-spacing: 2px;"></canvas>
                            <input type="text" id="admin-captcha-input" placeholder="위 그림의 문자를 입력하세요" style="width: 100%; padding: 12px; font-size: 14px; text-align: center; border: 1px solid #ccc; border-radius: 6px;" onkeydown="if(event.key === 'Enter'){ event.preventDefault(); AdminManager.submitCode(); }">
                        </div>
                    </div>

                    <button type="button" onclick="event.preventDefault(); event.stopPropagation(); AdminManager.submitCode();" style="width: 100%; background: #2ecc71; color: white; border: none; padding: 14px; font-size: 16px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s;">인증 확인 및 로그인</button>
                </div>
            </div>
        </div>
    </div>

    <div id="helpModal" class="help-modal-overlay" style="display:none;">
        <div class="help-modal-content">
            <span class="help-close-btn" onclick="document.getElementById('helpModal').style.display='none'">&times;</span>
            <div id="helpContentInject"></div>
        </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>

  <script src="js/config.js" defer></script>
  <script src="js/utils.js" defer></script> <script src="js/auth.js" defer></script>
  <script src="js/map.js" defer></script>
  <script src="js/share_main.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
</html>
