<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>화성오산 공유학교 지도</title>
  
  <meta name="description" content="경기도 화성시, 오산시의 초·중·고등학교 및 다(多)가치, 오산나래 공유학교 위치와 상세 정보를 한눈에 확인하세요.">
  <meta name="keywords" content="화성오산교육지원청, 화성 학교지도, 오산 학교지도, 공유학교 지도, 화성 다가치, 오산나래, 코코, 까까, 공유학교, 경기도, 화성시, 오산시, 공유학교, 메모">
  
  <meta property="og:type" content="website">
  <meta property="og:title" content="화성오산 학교 & 공유학교 지도">
  <meta property="og:description" content="경기도 화성시, 오산시의 학교 및 공유학교 위치를 한눈에 확인하세요. 회원가입 후 메모도 가능합니다!">
  <meta property="og:image" content="https://goehsmap.o-r.kr/source/share.png"> 
  <meta property="og:url" content="https://goehsmap.o-r.kr/share">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/header.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/ui.css" />
  <link rel="stylesheet" href="css/marker.css" />
  <link rel="stylesheet" href="css/popup.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  
  <link rel="stylesheet" href="css/legend.css" />
  <link rel="stylesheet" href="css/tooltip.css" />
  <link rel="stylesheet" href="css/share.css" />
</head>
<body>
  <div class="container"> 
    <div class="pc-top-bar"></div>

    <header class="header-center-group">
      <div class="header-shape" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
        <div class="logo-group" style="width: 40px; display: flex; justify-content: flex-start;">
          <button class="help-button" id="helpBtn">?</button>
        </div>
        <div class="title-wrapper" style="display: flex; align-items: center; justify-content: center; gap: 10px;">
          <a href="https://gong-u.goe.go.kr/base/main/view" target="_blank" class="logo-area" style="display: flex; align-items: center;">
            <img src="source/share.png" alt="Share" class="logo-img" style="height: 32px; width: auto; border-radius: 4px; background: white;" />
          </a>
          <span class="header_text" id="header-title" style="margin: 0;">화성오산 공유학교 지도</span>
          <a href="/" class="title-switch-btn" title="학교 지도로 전환" style="overflow: hidden; background: white; padding: 0; display:flex; align-items:center; justify-content:center; width: 28px; height: 28px; flex-shrink: 0; margin-left: 2px;">
            <img src="source/hwaologo.svg" alt="학교지도" style="width: 80%; height: 80%; object-fit: contain; margin-left: 2px;" />
          </a>
        </div>
        <div style="width: 40px; min-width: 40px;"></div>
      </div>
    </header>
    
    <div class="search-container">
        <div class="search-wrapper">
            <input type="text" id="schoolSearch" class="search-input-box" placeholder="공유학교명 검색" autocomplete="off" />
            <div id="searchResults" class="search-results-list"></div>
        </div>
    </div>

    <div id="header-user-status" style="position: absolute; right: 20px; top: 15px; display: flex; align-items: center; z-index: 1000;">
        <button onclick="location.href='/login'" style="background: #2563eb; color: white; border: none; padding: 8px 18px; border-radius: 20px; font-weight: bold; font-size: 14px; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.2); transition: background 0.2s;">로그인 / 가입</button>
    </div>

    <div class="boundary-toggle-container">
        <div class="control-row">
            <span class="switch-label">행정구역 켜기/끄기</span>
            <label class="toggle-switch">
                <input type="checkbox" id="toggle-boundary" checked>
                <span class="slider"></span>
            </label>
        </div>
        <div class="control-row" style="margin-left: 15px;">
            <span class="switch-label">즐겨찾기</span>
            <label class="toggle-switch">
                <input type="checkbox" id="toggle-favorite-only">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <div id="map"></div>
    <button id="btn-measure" onclick="DistanceManager.toggle()">📏 거리재기</button>

    <div id="helpModal" class="help-modal-overlay" style="display:none;">
        <div class="help-modal-content">
            <span class="help-close-btn" onclick="document.getElementById('helpModal').style.display='none'">&times;</span>
            <div id="helpContentInject"></div>
        </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script src="js/config.js" defer></script>
  <script src="js/utils.js" defer></script> 
  <script src="/login/auth.js" defer></script>
  <script src="js/map.js" defer></script>
  <script src="js/share_main.js" defer></script>
</body>
</html>
